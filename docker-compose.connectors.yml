# The database servers the connector tier-2 claims rest on.
#
# `test_containers.py` drives the PostgreSQL, MySQL and MariaDB connectors
# against real servers. CI starts these as service containers; this file is the
# same thing for a laptop, so a developer can reproduce what CI runs:
#
#   docker compose -f docker-compose.connectors.yml up -d
#   export CONNECTORS_TEST_POSTGRES_URL=postgresql+psycopg://platform:platform@127.0.0.1:15432/platform
#   export CONNECTORS_TEST_MYSQL_URL=mysql+pymysql://root:platform@127.0.0.1:13306/platform
#   export CONNECTORS_TEST_MARIADB_URL=mysql+pymysql://root:platform@127.0.0.1:13307/platform
#   .venv/bin/python -m pytest services/service-connectors/tests/test_containers.py -q
#
# MinIO stands in for S3 when testing delivery to an S3-compatible store:
#   export DELIVERY_TEST_S3_ENDPOINT=http://127.0.0.1:19000 DELIVERY_TEST_S3_BUCKET=deliveries \
#          DELIVERY_TEST_S3_KEY=platform DELIVERY_TEST_S3_SECRET=platform-secret
#   .venv/bin/python -m pytest services/service-destinations/tests/test_deliver.py -q
# (the test creates the bucket if it is missing)
#
# With the PostgreSQL and MySQL URLs above exported, these also run for real:
#   .venv/bin/python -m pytest services/service-destinations/tests/test_copy_database.py \
#          services/service-destinations/tests/test_sql_writer.py -q
#
# Deliberately on non-default ports: the platform's own Postgres is already on
# 5432, and a verification suite that wrote into the application database would
# be a bad afternoon. Nothing here shares a volume, so `down -v` is free.
services:
  connectors-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports: ["15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  connectors-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: platform
      MYSQL_DATABASE: platform
    ports: ["13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pplatform"]
      interval: 5s
      timeout: 5s
      retries: 30

  connectors-mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: platform
      MARIADB_DATABASE: platform
    ports: ["13307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  connectors-minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform-secret
    ports: ["19000:9000"]
