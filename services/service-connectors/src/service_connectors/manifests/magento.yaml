key: magento
label: Magento
category: saas
description: Read orders, products, and customers from Magento.
docs_url: https://developer.adobe.com/commerce/webapi/rest/
base_url: https://{store_url}/rest/V1
auth:
  kind: bearer
  template: Bearer {token}
streams:
  - name: orders
    path: /orders
    records_path: items
    primary_key: entity_id
    pagination: &id001
      kind: page
      page_param: page
      size_param: per_page
      page_size: 100
  - name: products
    path: /products
    records_path: items
    primary_key: id
    pagination: *id001
  - name: customers
    path: /customers/search
    records_path: items
    primary_key: id
    pagination: *id001
tier: 4
config_fields:
  - name: store_url
    label: Store URL
