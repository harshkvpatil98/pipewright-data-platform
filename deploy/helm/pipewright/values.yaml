# Default values for the Pipewright chart. Override per environment.

# One registry + tag for both images by default; override per component if they
# ever diverge. Tag is intentionally empty so a release must set it explicitly
# rather than silently deploying "latest".
image:
  registry: ghcr.io/harshkvpatil98
  gatewayRepository: pipewright-gateway
  webRepository: pipewright-web
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-secret configuration, rendered into a ConfigMap and shared by every
# component. Add any BACKEND_* / OIDC_* / SCHEDULER_* env here.
config:
  APP_ENV: production
  BACKEND_PORT: "8000"
  # Comma- or JSON-list of allowed browser origins for the gateway.
  BACKEND_CORS_ORIGINS: "[]"
  # Where the web's server reaches the API. Left out, it is this release's
  # gateway service inside the cluster. (The browser's address is built into
  # the web image: /api/v1 on the same host, which the ingress sends to the
  # gateway.)
  # API_INTERNAL_BASE_URL: "http://<release>-pipewright-gateway:8000/api/v1"
  # Where people open Pipewright (https://pipewright.example.com), for links in
  # emails and embedded dashboards.
  WEB_BASE_URL: ""
  # How many proxies sit in front: 1 behind this chart's ingress, one more for
  # a load balancer in front of that. The gateway reads each person's address
  # through them; the web passes a dashboard viewer's address on the same way.
  TRUSTED_PROXY_HOPS: "0"
  # Other sites that may show an embedded dashboard in a frame, separated by
  # spaces: "https://portal.example.com https://*.partner.io". Read by the web.
  EMBED_ALLOWED_ORIGINS: ""
  # Traces over OTLP/HTTP: set OTEL_ENABLED to "true" and point
  # OTEL_EXPORTER_OTLP_ENDPOINT at a collector, e.g. "http://otel-collector:4318".
  # OTEL_ENABLED: "true"
  # OTEL_EXPORTER_OTLP_ENDPOINT: ""

# Secret values. In production, prefer an existing Secret (existingSecret) that
# your secret manager syncs, so nothing sensitive lives in values or git.
secrets:
  # If set, that Secret is used verbatim and the keys below are ignored.
  existingSecret: ""
  # Only used when existingSecret is empty (dev/demo). Never commit real values.
  DATABASE_URL: ""
  AUTH_JWT_SECRET: ""
  AUTH_BOOTSTRAP_USERNAME: ""
  AUTH_BOOTSTRAP_PASSWORD: ""
  # Optional: encrypt stored files at rest (`openssl rand -base64 32`), and
  # the bucket's keys when storage.backend is s3.
  STORAGE_ENCRYPTION_KEY: ""
  STORAGE_S3_ACCESS_KEY_ID: ""
  STORAGE_S3_SECRET_ACCESS_KEY: ""
  # Encrypts saved passwords, keys and signing secrets (connections,
  # destinations, alert channels, embeds). Required to save any of them:
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  APP_SECRET_ENCRYPTION_KEY: ""

# Where stored files (uploads, datasets, versions) live. Every gateway, worker
# and ticker pod has to reach the same files, or a dataset uploaded through one
# pod is missing on the others and on the worker that runs its recipes.
#   local - a volume every pod mounts. Needs a ReadWriteMany storage class
#           (NFS, EFS, Filestore, Azure Files) because the pods can land on
#           different nodes.
#   s3    - a bucket (AWS S3, MinIO, R2...): nothing to share between pods.
#           Put STORAGE_S3_ACCESS_KEY_ID and STORAGE_S3_SECRET_ACCESS_KEY in the
#           Secret, or leave them out to use the pods' cloud identity.
storage:
  backend: local
  s3:
    bucket: ""
    prefix: ""
    # Empty for AWS; the store's address otherwise (http://minio:9000).
    endpointUrl: ""
    region: ""
  persistence:
    # A claim you made yourself; otherwise the chart makes one.
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteMany
    size: 20Gi

# Run `alembic upgrade head` as a pre-install/pre-upgrade hook so schema is
# migrated before any new pod serves traffic.
migrations:
  enabled: true

gateway:
  replicaCount: 2
  service:
    port: 8000
  # An upload is held while it is saved (and encrypted, with a key), so the
  # gateway needs about three times the largest upload on top of itself.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 1536Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

web:
  replicaCount: 2
  service:
    port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# The workflow worker. Scale replicas horizontally; the queue claim is leased,
# so several workers share the load safely.
worker:
  replicaCount: 1
  intervalSeconds: 5
  # The worker reads uploads over 25MB, delivers large datasets and copies
  # databases. Reading a CSV takes about nine times its size in memory (A8:
  # measured on 104MB and 200MB files), more for files of many short text
  # values, so 4Gi covers the default 200MB upload limit
  # (MAX_UPLOAD_SIZE_BYTES) with room. Lower that limit for a smaller worker.
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }

# The schedule ticker. Keep this at ONE replica unless every replica has a
# distinct SCHEDULER_RUNTIME_ID; the lease reduces but does not eliminate
# double-execution across pollers.
ticker:
  replicaCount: 1
  intervalSeconds: 30
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

ingress:
  enabled: false
  className: nginx
  # The web serves "/" and the gateway serves "/api" on the same host, so the
  # SSO session cookie carries across (see docs/enterprise-identity.md).
  host: pipewright.example.com
  # ingress-nginx refuses bodies over 1MB and gives up on a request after 60s
  # by default, which stops uploads (up to MAX_UPLOAD_SIZE_BYTES, 200MB) and
  # long answers. Another controller needs its own equivalents.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "210m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  tls:
    enabled: true
    secretName: pipewright-tls
