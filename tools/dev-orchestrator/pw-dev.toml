# Adopted configuration for Pipewright's development orchestrator.
#
# A run freezes this file at start and stores the frozen copy with the run.
# Editing it does not change the permissions or completion gates of a run
# already in flight.

# Which verification profile the registry uses. Only "pipewright" exists today.
verification_profile = "pipewright"

[providers.planner]
# OpenAI plans and reviews; Claude implements. Both roles here are read-only
# with respect to application code.
executable = "codex"
# Resolved on 2026-09-17 against codex-cli 0.149.1 by reading the model the CLI
# actually used for a probe session, rather than trusting configuration: the
# operator's ~/.codex/config.toml names "gpt-6-astra", which this CLI rejects
# with HTTP 400 ("requires a newer version of Codex"). Store what works.
model = "gpt-5.6-sol"
reasoning_effort = "high"

[providers.reviewer]
# A separate session from the planner, always. The reviewer must not inherit the
# planner's reasoning, or it reviews its own assumptions.
executable = "codex"
model = "gpt-5.6-sol"
reasoning_effort = "high"

[providers.implementer]
executable = "claude"
# An appropriate coding model, not the largest available one. Escalate a hard
# task with `--implementer-model opus` when failures or complexity justify it;
# starting there spends the budget before there is evidence it is needed.
model = "sonnet"

[limits]
# Conservative defaults. Every one of these pauses a run; none of them completes it.
max_parallel_workers = 3
per_task_seconds = 1800
total_run_seconds = 14400
provider_retries = 2
repair_rounds_per_task = 3
max_output_bytes = 8388608
plan_seconds = 2400
review_seconds = 2400
verification_seconds = 3600
max_context_file_bytes = 120000
max_context_files = 40

[isolation]
# "auto" resolves to "enforced" where the host can confine writes (macOS
# sandbox-exec, verified by probe at startup) and "supervised" otherwise.
mode = "auto"
unattended = false
# Leave false. Setting it allows unattended runs on a host that cannot prevent a
# worker writing outside its checkout.
allow_supervised_unattended = false

[publication]
# Publication authority is captured here, once, rather than asked for per run.
# "none" means verify locally and stop; "local_commit" commits without pushing;
# "feature_branch" pushes a dedicated branch. Pushing is not merging.
mode = "none"
remote = "origin"
branch_prefix = "pw-dev"
protected_branches = ["main", "master"]
author_name = "harshkvpatil98"
author_email = "harshkvpatil@gmail.com"
create_pull_request = false
wait_for_ci = false
