apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pipewright.configName" . }}
  labels:
    {{- include "pipewright.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if not (hasKey .Values.config "API_INTERNAL_BASE_URL") }}
  API_INTERNAL_BASE_URL: {{ printf "http://%s-gateway:%v/api/v1" (include "pipewright.fullname" .) .Values.gateway.service.port | quote }}
  {{- end }}
  STORAGE_BACKEND: {{ .Values.storage.backend | quote }}
  {{- if eq .Values.storage.backend "s3" }}
  STORAGE_S3_BUCKET: {{ .Values.storage.s3.bucket | quote }}
  STORAGE_S3_PREFIX: {{ .Values.storage.s3.prefix | quote }}
  STORAGE_S3_ENDPOINT_URL: {{ .Values.storage.s3.endpointUrl | quote }}
  STORAGE_S3_REGION: {{ .Values.storage.s3.region | quote }}
  {{- end }}
{{- if not .Values.secrets.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pipewright.secretName" . }}
  labels:
    {{- include "pipewright.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Dev/demo only. In production set secrets.existingSecret to a Secret your
  # secret manager owns, and leave these blank so nothing sensitive is in git.
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  AUTH_JWT_SECRET: {{ .Values.secrets.AUTH_JWT_SECRET | quote }}
  AUTH_BOOTSTRAP_USERNAME: {{ .Values.secrets.AUTH_BOOTSTRAP_USERNAME | quote }}
  AUTH_BOOTSTRAP_PASSWORD: {{ .Values.secrets.AUTH_BOOTSTRAP_PASSWORD | quote }}
  {{- range $key := list "STORAGE_ENCRYPTION_KEY" "STORAGE_S3_ACCESS_KEY_ID" "STORAGE_S3_SECRET_ACCESS_KEY" "APP_SECRET_ENCRYPTION_KEY" }}
  {{- with index $.Values.secrets $key }}
  {{ $key }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
