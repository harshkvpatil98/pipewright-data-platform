key: dynamics365
label: Dynamics 365
category: saas
description: Read accounts, contacts, and opportunities from Dynamics 365.
docs_url: https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/overview
base_url: https://{org}.api.crm.dynamics.com/api/data/v9.2
auth:
  kind: bearer
  template: Bearer {token}
streams:
  - name: accounts
    path: /accounts
    records_path: value
    primary_key: accountid
    pagination:
      kind: cursor
      cursor_param: $skiptoken
      cursor_path: '@odata.nextLink'
      page_size: 100
  - name: contacts
    path: /contacts
    records_path: value
    primary_key: contactid
    pagination:
      kind: cursor
      cursor_param: $skiptoken
      cursor_path: '@odata.nextLink'
      page_size: 100
  - name: opportunities
    path: /opportunities
    records_path: value
    primary_key: opportunityid
    pagination:
      kind: cursor
      cursor_param: $skiptoken
      cursor_path: '@odata.nextLink'
      page_size: 100
tier: 4
config_fields:
  - name: org
    label: Organisation name
    help: The part before .api.crm in your Dynamics URL.
