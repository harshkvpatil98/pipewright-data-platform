key: pendo
label: Pendo
category: saas
description: Read features, pages, and guides from Pendo.
docs_url: https://engageapi.pendo.io/
base_url: https://app.pendo.io/api/v1
auth:
  kind: api_key
  placement: header
  header: X-Pendo-Integration-Key
  template: '{token}'
streams:
  - name: features
    path: /feature
    primary_key: id
    pagination: &id001
      kind: none
  - name: pages
    path: /page
    primary_key: id
    pagination: *id001
  - name: guides
    path: /guide
    primary_key: id
    pagination: *id001
tier: 4
