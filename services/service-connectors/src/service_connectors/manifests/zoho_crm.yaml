key: zoho_crm
label: Zoho CRM
category: saas
description: Read leads, contacts, deals, and accounts from Zoho CRM.
docs_url: https://www.zoho.com/crm/developer/docs/api/v5/
base_url: https://www.zohoapis.com/crm/v5
auth:
  kind: api_key
  placement: header
  header: Authorization
  template: Zoho-oauthtoken {token}
streams:
  - name: leads
    path: /Leads
    records_path: data
    primary_key: id
    pagination: &id001
      kind: page
      page_param: page
      size_param: per_page
      page_size: 100
  - name: contacts
    path: /Contacts
    records_path: data
    primary_key: id
    pagination: *id001
  - name: accounts
    path: /Accounts
    records_path: data
    primary_key: id
    pagination: *id001
  - name: deals
    path: /Deals
    records_path: data
    primary_key: id
    pagination: *id001
tier: 4
