key: woocommerce
label: WooCommerce
category: saas
description: Read orders, products, and customers from WooCommerce.
docs_url: https://woocommerce.github.io/woocommerce-rest-api-docs/
base_url: https://{store_url}/wp-json/wc/v3
auth:
  kind: basic
  template: Basic {token}
streams:
  - name: orders
    path: /orders
    primary_key: id
    pagination: &id001
      kind: page
      page_param: page
      size_param: per_page
      page_size: 100
  - name: products
    path: /products
    primary_key: id
    pagination: *id001
  - name: customers
    path: /customers
    primary_key: id
    pagination: *id001
tier: 4
config_fields:
  - name: store_url
    label: Store URL
    placeholder: shop.example.com
