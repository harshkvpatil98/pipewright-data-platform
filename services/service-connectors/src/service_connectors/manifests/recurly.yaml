key: recurly
label: Recurly
category: saas
description: Read accounts, subscriptions, and invoices from Recurly.
docs_url: https://recurly.com/developers/api/v2021-02-25/
base_url: https://v3.recurly.com
auth:
  kind: basic
  template: Basic {token}
streams:
  - name: accounts
    path: /accounts
    records_path: data
    primary_key: id
    pagination:
      kind: next_url
      cursor_path: next
      page_size: 100
    schema:
      id:
        type: STRING
      code:
        type: STRING
      email:
        type: STRING
      created_at:
        type: TIMESTAMP
        tz_aware: true
      updated_at:
        type: TIMESTAMP
        tz_aware: true
  - name: subscriptions
    path: /subscriptions
    records_path: data
    primary_key: id
    pagination:
      kind: next_url
      cursor_path: next
      page_size: 100
    schema:
      id:
        type: STRING
      state:
        type: STRING
      created_at:
        type: TIMESTAMP
        tz_aware: true
      updated_at:
        type: TIMESTAMP
        tz_aware: true
  - name: invoices
    path: /invoices
    records_path: data
    primary_key: id
    pagination:
      kind: next_url
      cursor_path: next
      page_size: 100
tier: 2
verified_by: test_vendor_contracts.py
