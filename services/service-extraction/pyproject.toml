[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-extraction"
version = "0.1.0"
license = "MIT"
description = "Database extraction and incremental loading for Pipewright"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pymysql>=1.1,<2.0",
  # Live feeds (D1): each kind's client, so every kind the catalogue lists works here.
  "mysql-replication>=1.0.9,<2.0",
  "pymongo>=4.10,<5.0",
  "pymssql>=2.3,<3.0",
  "confluent-kafka>=2.6,<3.0",
  "boto3>=1.35,<2.0",
  "httpx>=0.27,<1.0",
  "pyjwt[crypto]>=2.8,<3.0",
  "pulsar-client>=3.5,<4.0",
  "pika>=1.3,<2.0",
  "nats-py>=2.9,<3.0",
  "paho-mqtt>=2.1,<3.0",
  "shared-python>=0.1.0",
  "service-auth>=0.1.0",
  "service-projects>=0.1.0",
  "service-datasets>=0.1.0",
  "service-pipeline-runs>=0.1.0",
  "service-ingestion>=0.1.0",
  "service-transformations>=0.1.0",
  "service-quality>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
]
