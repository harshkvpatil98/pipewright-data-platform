{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pipewright.fullname" . }}-migrate
  labels:
    {{- include "pipewright.labels" . | nindent 4 }}
  annotations:
    # Run migrations before any new pod serves traffic; a failed migration
    # blocks the release rather than letting mismatched code start.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "pipewright.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "pipewright.gatewayImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
          envFrom:
            {{- include "pipewright.envFrom" . | nindent 12 }}
{{- end }}
