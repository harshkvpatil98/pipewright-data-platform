[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-enterprise"
version = "0.1.0"
license = "MIT"
description = "Tenancy, fine-grained security, retention, cost, and telemetry for Pipewright"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "pyjwt>=2.15,<3.0",
  "shared-python>=0.1.0",
  "service-auth>=0.1.0",
  "service-projects>=0.1.0",
  "service-access>=0.1.0",
  "service-datasets>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0"]
