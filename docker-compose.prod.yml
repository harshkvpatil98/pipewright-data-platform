# Production-style compose: pre-built images, all four runtimes, Postgres, and a
# Caddy reverse proxy that terminates TLS and routes /api to the gateway and /
# to the web on one host (so the SSO session cookie carries across both).
#
#   PIPEWRIGHT_TAG=v1.2.3 SITE_ADDRESS=pipewright.example.com \
#     docker compose -f docker-compose.prod.yml up -d
#
# Env comes from ./.env (DATABASE_URL is derived below from the Postgres vars).
# For a managed database, drop the `postgres` service and point DATABASE_URL at
# it in .env. See docs/operations.md.

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ${PIPEWRIGHT_REGISTRY:-ghcr.io/harshkvpatil98}/pipewright-gateway:${PIPEWRIGHT_TAG:?set PIPEWRIGHT_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [./.env]
    environment: *app-env
    # Migrate, then serve: the schema is current before traffic arrives.
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  workflow-worker:
    image: ${PIPEWRIGHT_REGISTRY:-ghcr.io/harshkvpatil98}/pipewright-gateway:${PIPEWRIGHT_TAG:?set PIPEWRIGHT_TAG}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    env_file: [./.env]
    environment: *app-env
    command: sh -c "until alembic -c alembic.ini current >/dev/null 2>&1; do sleep 2; done; platform-workflow-worker --interval ${WORKFLOW_WORKER_INTERVAL:-5}"

  schedule-ticker:
    image: ${PIPEWRIGHT_REGISTRY:-ghcr.io/harshkvpatil98}/pipewright-gateway:${PIPEWRIGHT_TAG:?set PIPEWRIGHT_TAG}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    env_file: [./.env]
    environment: *app-env
    command: sh -c "until alembic -c alembic.ini current >/dev/null 2>&1; do sleep 2; done; platform-schedule-ticker --loop --interval ${SCHEDULE_TICKER_INTERVAL:-30}"

  web:
    image: ${PIPEWRIGHT_REGISTRY:-ghcr.io/harshkvpatil98}/pipewright-web:${PIPEWRIGHT_TAG:?set PIPEWRIGHT_TAG}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    env_file: [./.env]

  # Terminates TLS (Caddy fetches a certificate for SITE_ADDRESS automatically)
  # and reverse-proxies to the gateway and web. For an internal/manual cert,
  # replace Caddy with your own proxy and mount the cert; the routing is the
  # same (/api -> gateway:8000, everything else -> web:3000).
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [gateway, web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
