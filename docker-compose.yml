# Profiles keep the app tier and the background runtime independently
# startable:
#   docker compose --profile app up                     # postgres + gateway + web
#   docker compose --profile app --profile worker up    # + workflow worker + schedule ticker
#   docker compose --profile worker up                  # postgres + the workers only
# Postgres joins both profiles because every tier needs it.
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["app", "worker"]
    restart: unless-stopped
    # Logical WAL so Pipewright's own change-data-capture source can follow
    # a database's change log (Phase 20). Harmless for everything else.
    command: postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/api-gateway/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn api_gateway.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      - api-gateway
    env_file:
      - ./apps/web/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      API_INTERNAL_BASE_URL: http://api-gateway:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    command: npm run dev --workspace @platform/web -- --hostname 0.0.0.0 --port 3000

  workflow-worker:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/api-gateway/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
    # Waits for the gateway's migrations to create the tables it reads; a short
    # retry loop is cheaper than ordering the two containers.
    command: sh -c "until alembic -c alembic.ini current >/dev/null 2>&1; do sleep 2; done; platform-workflow-worker --interval ${WORKFLOW_WORKER_INTERVAL:-5}"

  schedule-ticker:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    profiles: ["worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/api-gateway/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}
    command: sh -c "until alembic -c alembic.ini current >/dev/null 2>&1; do sleep 2; done; platform-schedule-ticker --loop --interval ${SCHEDULE_TICKER_INTERVAL:-30}"

volumes:
  postgres_data:
