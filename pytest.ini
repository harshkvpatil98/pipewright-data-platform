[pytest]
# Warning policy only — pytest invocation flags stay in scripts/test.sh.
#
# The gate is zero warnings in the summary: every warning is fixed at its
# source, or filtered at the exact site (see the schema_json note in
# service_datasets/schemas.py), or listed here with its reason.
filterwarnings =
    ; fastapi's testclient import advises installing the not-yet-released
    ; httpx2 successor. Upstream migration notice; nothing here can fix it.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
    ; anyio 4.15 began warning about an alias that starlette's own testclient
    ; module uses at import time (`anyio.abc.BlockingPortal`). It fires before
    ; any test runs, in third-party code, and only on installs new enough to
    ; have resolved anyio >= 4.15 -- nothing here can fix it, and pinning anyio
    ; backwards to hide it would be worse than saying so.
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*
