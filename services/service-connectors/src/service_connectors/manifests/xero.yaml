key: xero
label: Xero
category: saas
description: Read contacts, invoices, and accounts from Xero.
docs_url: https://developer.xero.com/documentation/api/accounting/overview
base_url: https://api.xero.com/api.xro/2.0
auth:
  kind: bearer
  template: Bearer {token}
streams:
  - name: contacts
    path: /Contacts
    records_path: Contacts
    primary_key: ContactID
    pagination: &id001
      kind: page
      page_param: page
      size_param: per_page
      page_size: 100
  - name: invoices
    path: /Invoices
    records_path: Invoices
    primary_key: InvoiceID
    pagination: *id001
  - name: accounts
    path: /Accounts
    records_path: Accounts
    primary_key: AccountID
    pagination:
      kind: none
tier: 4
