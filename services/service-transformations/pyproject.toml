[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-transformations"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pandas>=2.2,<3.0",
  "holidays>=0.60,<1.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.9,<3.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.11,<2.0",
  "shapely>=2.0,<3.0",
  "statsmodels>=0.14,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "shared-python>=0.1.0",
  "service-auth>=0.1.0",
  "service-datasets>=0.1.0",
  "service-ingestion>=0.1.0",
  "service-notifications>=0.1.0",
  "service-pipeline-runs>=0.1.0",
  "service-projects>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]
