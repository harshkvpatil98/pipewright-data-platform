[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-connectors"
version = "0.1.0"
description = "The connector SDK for Pipewright: one interface for every source and destination"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "shared-python>=0.1.0",
  "service-auth>=0.1.0",
  "service-projects>=0.1.0",
  "service-extraction>=0.1.0",
  "httpx>=0.27,<1.0",
  "pyarrow>=15,<26",
  "fastavro>=1.9,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]
