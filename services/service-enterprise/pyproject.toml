[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-enterprise"
version = "0.1.0"
description = "Tenancy, fine-grained security, retention, cost, and telemetry for Pipewright"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "pyjwt>=2.8,<3.0",
  # SAML assertion signatures. signxml is pure Python over lxml + cryptography,
  # so it installs from a wheel everywhere; python-xmlsec would make the
  # libxmlsec1 system library a prerequisite of setup and CI for everybody,
  # including the majority who never enable SAML. Pinned below 5.0 because that
  # release requires cryptography>=45 and shared-python pins cryptography<45.
  "signxml>=4.5,<5",
  "shared-python>=0.1.0",
  "service-auth>=0.1.0",
  "service-projects>=0.1.0",
  "service-access>=0.1.0",
  "service-datasets>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]
