[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway"
version = "0.1.0"
description = "API gateway for Pipewright"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.8,<3.0",
  "python-dotenv>=1.1,<2.0",
  # FastAPI parses form bodies through this. The SAML assertion consumer route
  # is a form POST, so the gateway needs it directly rather than by inheritance
  # from whichever service happens to declare it for file uploads.
  "python-multipart>=0.0.20,<1.0",
  "service-auth>=0.1.0",
  "service-comparisons>=0.1.0",
  "service-destinations>=0.1.0",
  "service-extraction>=0.1.0",
  "service-datasets>=0.1.0",
  "service-ingestion>=0.1.0",
  "service-notifications>=0.1.0",
  "service-pipeline-runs>=0.1.0",
  "service-projects>=0.1.0",
  "service-quality>=0.1.0",
  "service-workflows>=0.1.0",
  "service-schedules>=0.1.0",
  "service-sources>=0.1.0",
  "service-transformations>=0.1.0",
  "shared-python>=0.1.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  # Pinned to a minor series: ruff expands its default rule set between minors,
  # so an open range makes `make verify` fail on unrelated new lint rules.
  "ruff>=0.11,<0.12"
]

[project.scripts]
platform-bootstrap-user = "api_gateway.scripts.bootstrap_user:main"
platform-workflow-worker = "api_gateway.scripts.workflow_worker:main"
run-due-schedules = "api_gateway.scripts.run_due_schedules:main"
platform-schedule-ticker = "api_gateway.scripts.run_due_schedules:main"
scim-sync = "api_gateway.scripts.scim_sync:main"

[tool.setuptools.packages.find]
where = ["src"]
