[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipewright-client"
version = "1.0.0"
description = "Pipewright's Python client and command line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[project.scripts]
pipewright = "pipewright.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
