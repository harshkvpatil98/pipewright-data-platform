# Continuous integration — mirrors local `make verify` after a Python venv bootstrap.
# Uses scripts/verify-release.sh (ruff, pytest bundle, ESLint, tsc, next build).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real database servers, so the connectors that claim tier 2 ("runs against
    # a container in CI on every merge") are making a true statement. Without
    # these the suite still passes -- `test_containers.py` skips what it cannot
    # reach -- but the tier badge would be decoration, which is the one thing
    # the tier system is not allowed to be.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: platform
          MYSQL_DATABASE: platform
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pplatform"
          --health-interval 10s --health-timeout 5s --health-retries 15
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: platform
          MARIADB_DATABASE: platform
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 15

    env:
      CONNECTORS_TEST_POSTGRES_URL: postgresql+psycopg://platform:platform@127.0.0.1:5432/platform
      CONNECTORS_TEST_MYSQL_URL: mysql+pymysql://root:platform@127.0.0.1:3306/platform
      CONNECTORS_TEST_MARIADB_URL: mysql+pymysql://root:platform@127.0.0.1:3307/platform
      # MinIO (started below) stands in for S3: stored files in a bucket, two
      # gateways sharing one, and delivery to an S3-compatible store.
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_S3_BUCKET: pipewright-files
      STORAGE_TEST_S3_KEY: platform
      STORAGE_TEST_S3_SECRET: platform-secret
      DELIVERY_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DELIVERY_TEST_S3_BUCKET: deliveries
      DELIVERY_TEST_S3_KEY: platform
      DELIVERY_TEST_S3_SECRET: platform-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Bootstrap Python venv (editable installs)
        run: bash ./scripts/ci-bootstrap-python-venv.sh

      - name: Start MinIO
        # A step rather than a service: MinIO needs `server /data` as its
        # command, which service containers cannot be given.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=platform -e MINIO_ROOT_PASSWORD=platform-secret \
            cgr.dev/chainguard/minio:latest server /data
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done

      - name: Confirm the connector containers are reachable
        # A silent skip here would mean the tier-2 claims quietly stopped being
        # true. Better to fail the build than to keep the badge.
        run: .venv/bin/python ./scripts/check-connector-servers.py

      - name: Verify (ruff, tests, lint, typecheck, web build)
        run: bash ./scripts/verify-release.sh

  # Every live-feed kind against a real server or the vendor's own test server
  # (D1): logical PostgreSQL, MySQL, a MongoDB replica set, SQL Server with
  # its Agent, Kafka, the Event Hubs emulator, a Kinesis test server, the
  # Pub/Sub emulator, Pulsar, RabbitMQ, NATS JetStream and Mosquitto, from
  # docker-compose.live.yml. The kinds' tier 2 rests on this job, so a server
  # that does not start fails it rather than letting its tests skip.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_TEST_SERVERS: "1"
      # The test servers are on the runner itself, which the outbound guard refuses by default.
      OUTBOUND_ALLOW_LOOPBACK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Start the live-feed test servers
        run: docker compose -f docker-compose.live.yml up -d --quiet-pull
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap Python venv
        run: bash ./scripts/ci-bootstrap-python-venv.sh
      - name: Confirm every test server works
        run: .venv/bin/python ./scripts/check-live-servers.py --wait 300
      - name: Every kind's round trip, the runner and live recipes
        run: |
          .venv/bin/python -m pytest --import-mode=importlib -q \
            services/service-extraction/tests/test_live_change_capture.py \
            services/service-extraction/tests/test_live_queues.py \
            services/service-extraction/tests/test_live_sources.py \
            services/service-extraction/tests/test_live_windows.py \
            services/service-extraction/tests/test_streams.py
      - name: The servers' logs, on failure
        if: failure()
        run: docker compose -f docker-compose.live.yml logs --tail 60

  # The images a release publishes, built on every push so a broken Dockerfile
  # fails here rather than on the release tag. Built, not pushed.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: gateway
            dockerfile: apps/api-gateway/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile.prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Hot read endpoints against their budgets (scripts/perf-baseline.py, A7):
  # a fresh database migrated from scratch, a gateway, five demo projects of
  # data, then each endpoint's p95 against its own budget.
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: perf
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d perf"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://platform:platform@127.0.0.1:5432/perf
      AUTH_JWT_SECRET: ci-performance-signing-secret-0123456789abcdef
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap Python venv
        run: bash ./scripts/ci-bootstrap-python-venv.sh
      - name: Migrate a fresh database
        working-directory: apps/api-gateway
        run: ../../.venv/bin/alembic -c alembic.ini upgrade head
      - name: Start the gateway
        working-directory: apps/api-gateway
        run: |
          ../../.venv/bin/platform-bootstrap-user --username perf-runner --password perf-runner-password --role admin
          nohup ../../.venv/bin/uvicorn api_gateway.main:app --host 127.0.0.1 --port 8000 > gateway.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health/live && break
            sleep 1
          done
      - name: Hot endpoints within budget
        run: |
          .venv/bin/python scripts/perf-baseline.py --base-url http://127.0.0.1:8000 \
            --username perf-runner --password perf-runner-password \
            --seed 5 --requests 100 --concurrency 4 --budgets
      - name: Gateway log on failure
        if: failure()
        run: tail -100 apps/api-gateway/gateway.log

  # The Terraform provider (Phase 23, X2): its unit tests, then real Terraform
  # against a real gateway on a fresh database, applying, importing, putting
  # back a change made in the app and destroying everything again.
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: terraform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d terraform"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://platform:platform@127.0.0.1:5432/terraform
      AUTH_JWT_SECRET: ci-terraform-signing-secret-0123456789abcdef
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: clients/terraform/go.mod
          cache-dependency-path: clients/terraform/go.sum
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Vet, format and unit tests
        working-directory: clients/terraform
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap Python venv
        run: bash ./scripts/ci-bootstrap-python-venv.sh
      - name: Migrate a fresh database
        working-directory: apps/api-gateway
        run: ../../.venv/bin/alembic -c alembic.ini upgrade head
      - name: Start the gateway and make an API token
        working-directory: apps/api-gateway
        run: |
          ../../.venv/bin/platform-bootstrap-user --username tf-admin --password tf-admin-password-0123 --role admin
          ../../.venv/bin/platform-bootstrap-user --username tf-member --password tf-member-password-0123 --role viewer
          # A connection's secrets are stored encrypted; a key made for this run only.
          APP_SECRET_ENCRYPTION_KEY=$(../../.venv/bin/python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          echo "::add-mask::$APP_SECRET_ENCRYPTION_KEY"
          export APP_SECRET_ENCRYPTION_KEY
          nohup ../../.venv/bin/uvicorn api_gateway.main:app --host 127.0.0.1 --port 8000 > gateway.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health/live && break
            sleep 1
          done
          session=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"tf-admin","password":"tf-admin-password-0123"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          token=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/tokens -H "Authorization: Bearer $session" \
            -H 'Content-Type: application/json' -d '{"name":"CI acceptance","scope":"admin","expires_in_days":1}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["secret"])')
          echo "::add-mask::$token"
          echo "PIPEWRIGHT_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Acceptance tests
        working-directory: clients/terraform
        env:
          TF_ACC: "1"
          PIPEWRIGHT_URL: http://127.0.0.1:8000
          PIPEWRIGHT_TEST_MEMBER: tf-member
        run: go test ./internal/provider -run TestAcc -v -count=1 -timeout 20m
      - name: Gateway log on failure
        if: failure()
        run: tail -100 apps/api-gateway/gateway.log

  # The golden path and the accessibility checks, in a real browser, against
  # the production web build and a gateway on a fresh database (A7, X8).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: browser
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d browser"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://platform:platform@127.0.0.1:5432/browser
      AUTH_JWT_SECRET: ci-browser-signing-secret-0123456789abcdef0123
      BACKEND_CORS_ORIGINS: '["http://127.0.0.1:3000"]'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
      API_INTERNAL_BASE_URL: http://127.0.0.1:8000/api/v1
      # 127.0.0.1 throughout: "localhost" can resolve to IPv6 first.
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_API_URL: http://127.0.0.1:8000/api/v1
      E2E_USERNAME: browser-runner
      E2E_PASSWORD: browser-runner-password
      # Single sign-on against a live provider: Keycloak, started below.
      OIDC_ISSUER: http://127.0.0.1:18080/realms/pipewright
      OIDC_CLIENT_ID: pipewright
      OIDC_CLIENT_SECRET: kc-test-client-secret
      OIDC_REDIRECT_URI: http://127.0.0.1:8000/api/v1/auth/sso/callback
      OIDC_GROUP_ROLE_MAP: '{"data-editors": "admin"}'
      WEB_BASE_URL: http://127.0.0.1:3000
      E2E_SSO_USERNAME: sso-ann
      E2E_SSO_PASSWORD: ann-sso-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm ci
      - name: Bootstrap Python venv
        run: bash ./scripts/ci-bootstrap-python-venv.sh
      - name: Start a Keycloak identity provider
        run: |
          docker run -d --name keycloak -p 18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=keycloak-admin \
            quay.io/keycloak/keycloak:26.0 start-dev
          for attempt in $(seq 1 90); do
            curl -sf http://127.0.0.1:18080/realms/master/.well-known/openid-configuration > /dev/null && break
            sleep 2
          done
          .venv/bin/python scripts/sso-test-provider.py \
            --redirect "$OIDC_REDIRECT_URI" --web "$E2E_BASE_URL"
          .venv/bin/python scripts/check-oidc.py
      - name: Migrate, add the test account, start the gateway
        working-directory: apps/api-gateway
        run: |
          ../../.venv/bin/alembic -c alembic.ini upgrade head
          ../../.venv/bin/platform-bootstrap-user --username "$E2E_USERNAME" --password "$E2E_PASSWORD" --role admin
          nohup ../../.venv/bin/uvicorn api_gateway.main:app --host 127.0.0.1 --port 8000 > gateway.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health/live && break
            sleep 1
          done
      - name: Build and start the web app
        run: |
          npm run build --workspace @platform/web
          nohup npm run start --workspace @platform/web -- --hostname 127.0.0.1 --port 3000 > web.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/login > /dev/null && break
            sleep 1
          done
      - name: Install the browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Golden path, accessibility and single sign-on
        working-directory: apps/web
        run: npx playwright test
      - name: Logs and report on failure
        if: failure()
        run: |
          tail -80 apps/api-gateway/gateway.log || true
          tail -80 web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore


  # The Helm chart installed on a new cluster by the deployment guide's own
  # steps (A9, Z4): scripts/helm-install-check.sh reads them from
  # docs/deployment-guide.md, so the guide and this job cannot drift apart.
  # A chart that passes a lint can still fail its first install; this one did
  # (a migration hook that read resources Helm makes after hooks).
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create a kind cluster with a port for the ingress
        uses: helm/kind-action@v1
        with:
          config: deploy/helm/ci-kind.yaml
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Install an ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=300s
      - name: Build both images, tagged as the release, and load them into the cluster
        run: |
          VERSION=$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/pipewright/Chart.yaml)
          docker build -t "ghcr.io/harshkvpatil98/pipewright-gateway:$VERSION" -f apps/api-gateway/Dockerfile .
          docker build -t "ghcr.io/harshkvpatil98/pipewright-web:$VERSION" -f apps/web/Dockerfile.prod .
          kind load docker-image "ghcr.io/harshkvpatil98/pipewright-gateway:$VERSION" "ghcr.io/harshkvpatil98/pipewright-web:$VERSION" --name chart-testing
      - name: Install by the deployment guide, and check it works
        run: bash scripts/helm-install-check.sh
      - name: What the cluster says, on failure
        if: failure()
        run: |
          kubectl -n pipewright get all,endpoints,ingress || true
          kubectl -n pipewright describe pods || true
          kubectl -n ingress-nginx logs deploy/ingress-nginx-controller --tail=60 || true
          for pod in $(kubectl -n pipewright get pods -o name); do echo "== $pod"; kubectl -n pipewright logs "$pod" --all-containers --tail=60 || true; done
