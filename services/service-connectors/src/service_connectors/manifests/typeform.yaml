key: typeform
label: Typeform
category: saas
description: Read forms and responses from Typeform.
docs_url: https://www.typeform.com/developers/get-started/
base_url: https://api.typeform.com
auth:
  kind: bearer
  template: Bearer {token}
streams:
  - name: forms
    path: /forms
    records_path: items
    primary_key: id
    pagination: &id001
      kind: page
      page_param: page
      size_param: per_page
      page_size: 100
    schema:
      id:
        type: STRING
      title:
        type: STRING
      last_updated_at:
        type: TIMESTAMP
        tz_aware: true
  - name: responses
    path: /forms/{form_id}/responses
    records_path: items
    primary_key: response_id
    pagination: *id001
    schema:
      response_id:
        type: STRING
      submitted_at:
        type: TIMESTAMP
        tz_aware: true
      landed_at:
        type: TIMESTAMP
        tz_aware: true
tier: 2
verified_by: test_vendor_contracts.py
config_fields:
  - name: form_id
    label: Form id
    required: false
